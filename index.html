<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デブ猫、詰まる。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
            --yellow: #ffd166;
            --red: #ff4d6d;
            --green: #3fdc7f;
        }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1d1712;
            font-family: var(--font);
            color: #fff;
            user-select: none;
        }
        #view canvas { display: block; }
        .hidden { display: none !important; }
        .panel {
            background: rgba(20, 14, 10, 0.62);
            border-radius: 12px;
            padding: 10px 14px;
            backdrop-filter: blur(4px);
        }
        .stroke { text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8); }

        #hud { position: fixed; inset: 0; pointer-events: none; }
        #status { position: absolute; left: 16px; top: 16px; min-width: 220px; }
        #stage-name { color: var(--yellow); font-weight: 800; font-size: 15px; }
        #weight { font-size: 40px; font-weight: 800; line-height: 1.1; }
        #weight.danger { color: var(--red); }
        #status .row { font-size: 14px; margin-top: 3px; }
        #status .ok { color: var(--green); }
        #status .ng { color: var(--red); }
        #damage { color: #ff9aa8; }
        #right { position: absolute; right: 16px; top: 16px; width: 360px; text-align: right; }
        #timer { font-size: 22px; font-weight: 800; }
        #timer.danger { color: var(--red); }
        #objectives { list-style: none; margin: 8px 0 0; padding: 10px 14px; text-align: left; font-size: 15px; }
        #objectives li { margin: 4px 0; }
        #objectives li.done { color: var(--green); text-decoration: line-through; opacity: 0.8; }
        #objectives .hint { display: block; font-size: 12px; color: #d8cbb8; margin-left: 1.3em; }
        #warning {
            position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
            font-size: 34px; font-weight: 800; color: var(--red);
            animation: pulse 0.3s infinite alternate;
        }
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.06); } }
        #narration {
            position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
            font-size: 22px; font-weight: 800; white-space: nowrap; transition: opacity 0.3s;
        }
        #tips { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #d8cbb8; text-align: center; }
        #banner {
            position: absolute; top: 38%; left: 0; right: 0; text-align: center;
            background: rgba(0, 0, 0, 0.55); padding: 18px 0; font-size: 20px; opacity: 0;
        }
        #banner .big { font-size: 42px; font-weight: 800; color: var(--yellow); }
        #banner.fade { animation: banner 2.6s ease forwards; }
        @keyframes banner { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
        #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .floater { position: absolute; left: 0; top: 0; font-weight: 800; white-space: nowrap; text-shadow: 0 2px 0 #000, 0 0 6px #000; }

        .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #title { justify-content: space-between; padding: 40px 0 30px; box-sizing: border-box; pointer-events: none; }
        #title > * { pointer-events: auto; }
        #title h1 { margin: 0; font-size: 84px; font-weight: 800; color: var(--yellow); text-shadow: 0 5px 0 #000, 0 0 20px rgba(0,0,0,0.6); }
        #title .sub { font-size: 24px; font-weight: 800; margin-top: 6px; }
        #title .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        button {
            font-family: var(--font); font-weight: 800; border: none; border-radius: 10px; cursor: pointer;
            background: #d62839; color: #fff; padding: 10px 18px; font-size: 16px;
            box-shadow: 0 4px 0 #7a1020;
        }
        button:hover:not(:disabled) { filter: brightness(1.15); }
        button:disabled { background: #3a3230; color: #777; box-shadow: none; cursor: default; }
        #title-start { font-size: 30px; padding: 12px 36px; }
        #title-stages { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
        #title-stats { font-size: 14px; color: #d8cbb8; }
        #title-ending { color: #ff9aa8; font-size: 26px; font-weight: 800; }
        #result, #pause { background: rgba(0, 0, 0, 0.6); gap: 14px; }
        #result-title { font-size: 64px; font-weight: 800; }
        #result.fail #result-title { color: var(--red); }
        #result.clear #result-title { color: var(--yellow); }
        #result-line { font-size: 24px; }
        #result-stats { font-size: 18px; color: #ffd8a8; }
        #result .buttons { display: flex; gap: 12px; margin-top: 8px; }
        #pause { cursor: pointer; font-size: 28px; font-weight: 800; }
        #pause small { font-size: 15px; font-weight: 500; color: #d8cbb8; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #1d1712; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
</head>
<body>
    <div id="view"></div>

    <div id="hud" class="hidden">
        <div id="status" class="panel">
            <div id="stage-name"></div>
            <div id="weight" class="stroke">3.0 kg</div>
            <div class="row" id="jump"></div>
            <div class="row" id="sofa"></div>
            <div class="row" id="damage"></div>
        </div>
        <div id="right">
            <div id="timer" class="stroke"></div>
            <ul id="objectives" class="panel"></ul>
        </div>
        <div id="warning" class="stroke hidden"></div>
        <div id="banner" class="stroke"></div>
        <div id="narration" class="stroke"></div>
        <div id="tips" class="stroke"></div>
    </div>
    <div id="floaters"></div>

    <div id="title" class="overlay">
        <div style="text-align:center">
            <h1>デブ猫、詰まる。</h1>
            <div class="sub stroke">太るほど強い。でも隙間に詰まる。100kgで破裂する。</div>
        </div>
        <div class="bottom">
            <div id="title-ending" class="stroke hidden">全ステージクリアおめでとう!</div>
            <button id="title-start">はじめる</button>
            <div id="title-stages"></div>
            <div id="title-stats" class="stroke"></div>
            <div class="stroke" style="font-size:13px;color:#d8cbb8">実況・動画投稿 大歓迎！　マウスで見回す / WASD で移動 / スペースでジャンプ / クリックで猫パンチ</div>
        </div>
    </div>

    <div id="result" class="overlay hidden">
        <div id="result-title" class="stroke"></div>
        <div id="result-line" class="stroke"></div>
        <div id="result-stats" class="stroke"></div>
        <div class="buttons">
            <button id="result-retry">もう一回（R）</button>
            <button id="result-next">次のステージ</button>
            <button id="to-title">タイトル</button>
        </div>
    </div>

    <div id="pause" class="overlay hidden">
        クリックで操作を再開
        <small>マウスで見回す / WASD 移動 / スペース ジャンプ（長押しで高く）/ クリック 猫パンチ / F 吐く / E 鳴く / Shift 走る / R やり直し</small>
    </div>

    <div id="loading">読み込み中…</div>

    <script type="module" src="./fatcat/main.js"></script>
</body>
</html>
